$schema: https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json
version: 3
final_space: true

palette:
  white: "15"
  light_gray: "244"
  gray: "239"
  dark_gray: "234"
  black: "0"
  cyan: "39"
  bright_cyan: "81"
  light_cyan: "159"
  yellow: "11"

# TODO:
# - Adjust colors

blocks:

- type: prompt
  alignment: left
  newline: true

  segments:
  - type: text
    foreground: p:gray
    template: "{{ if gt .PromptCount 1 }} ❰  {{ end }}"

  - type: status
    template: "{{ if gt .PromptCount 1 }}∴ {{ .Code }}{{ if ne (reason .Code) (toString .Code) }} = {{ lower (reason .Code) }}{{ end }}{{ end }}"
    foreground_templates:
    - "{{ if .Error }}204{{ end }}"
    - "{{ if not .Error }}150{{ end }}"
    properties:
      always_enabled: true

  - type: executiontime
    template: "{{ if gt .PromptCount 1 }}  |  ⏳{{ sub (now | unixEpoch) (div .Ms 1000) | date \"15:04:05\" }} 🡲 {{ now | date \"15:04:05\" }} = {{ .FormattedMs }}\n{{ end }}"
    properties:
      always_enabled: true
      style: roundrock

- type: prompt
  alignment: left
  newline: true

  segments:
  # - type: time
  #   style: powerline
  #   foreground: p:light_gray
  #   background: p:dark_gray
  #   template: " {{ .CurrentDate | date .Format }} "
  #   properties:
  #     time_format: 15:04

  - type: path
    style: diamond
    trailing_diamond: 🭬
    foreground: p:black
    background: p:cyan
    template: " {{ .Path }} "
    properties:
      style: full
      # style: agnoster_short
      # max_depth: 3
      hide_root_location: true


  - type: git
    style: diamond
    trailing_diamond: 🭬
    foreground: p:black
    background: p:bright_cyan
    template: "{{ if .Ref }}  {{ .Ref}} {{ end }}"

  - type: git
    style: diamond
    trailing_diamond: 🭬
    foreground: p:light_cyan
    background: p:light_cyan
    # \e[D moves the cursor left once to make a very thin powerline section
    template: "{{ if .Working }}*\e[D{{ end }}"

- type: prompt
  alignment: left
  newline: true

  segments:
  - type: text
    foreground: p:cyan
    template: "\n ❱ "

secondary_prompt:
  foreground: p:cyan
  template: " ❱❱   "
